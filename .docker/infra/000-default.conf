<VirtualHost *:80>
  DocumentRoot /var/www/html/public

  SetEnv OTEL_PHP_AUTOLOAD_ENABLED true
  SetEnv OTEL_SERVICE_NAME my_symfony
  SetEnv OTEL_TRACES_EXPORTER otlp
  SetEnv OTEL_EXPORTER_OTLP_ENDPOINT http://my-otel-collector:4318
  SetEnv OTEL_METRICS_EXPORTER none
  SetEnv OTEL_LOGS_EXPORTER none

  <Directory /var/www/html/public>
    AllowOverride All
    Require all granted
    FallbackResource /index.php
  </Directory>
  
  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>